server {
    listen 80;
    server_name pokesync localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Keep Nginx's normal MIME types.
    include /etc/nginx/mime.types;

    # Explicitly ensure ES modules use JavaScript MIME type.
    types {
        application/javascript mjs;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
