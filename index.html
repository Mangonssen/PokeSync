<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeSync</title>
    <script type="module" src="index.mjs"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.ico" type="image/x-icon">
</head>

<body>
    <header>
        <hgroup>
            <picture id="logo"><img src="pokesync-logo.png" alt=""></picture>
            <h1 class="sr-only">PokeSync</h1>
            <p>v1.0 by Mangonssen & LPTimey</p>
        </hgroup>
        <input type="text" list="pokedex-list">
    </header>
    <main>
        <aside>
            <form>
                <fieldset class="box-gray">
                    <legend>Controls</legend>
                    <ul>
                        <li><button aria-label="save"><img src="icons/controls/rewrite/save-x10.png" alt="save-icon"
                                    width="160" height="160">save</button></li>
                        <li><button aria-label="export"><img src="icons/controls/rewrite/export-x10.png" alt="export-icon"
                                    width="80" height="80">export</button></li>
                        <li><button aria-label="open"><img src="icons/controls/rewrite/open-x10.png" alt="open-icon"
                                    width="80" height="80">open</button></li>
                        <li><button aria-label="reset"><img src="icons/controls/rewrite/reset-x10.png" alt="reset-icon"
                                    width="80" height="80">reset</button></li>
                        <li><button aria-label="settings"><img src="icons/controls/rewrite/settings-x10.png" alt="settings-icon"
                                    width="80" height="80">settings</button></li>
                    </ul>
                </fieldset>
            </form>
        </aside>
        <div id="players">
            <section>
                <h2 contenteditable="">
                    Player 1
                </h2>
                <ul id="player1pokemon">
                    <li class="box" style="--color: red">
                        ABCDEFGHIKLMNOPQRSTUVWXYZ
                    </li>
                    <li class="box">
                        <form id="player1add"><button>+ Add new Pokémon</button></form>
                    </li>
                </ul>
            </section>
            <section>
                <h2 contenteditable="">
                    Player 2
                </h2>
                <ul id="player2pokemon">
                    <li class="box" style="--color: red">
                        HAHAHAHAHAHAHAH
                    </li>
                    <li class="box">
                        <form id="player2add"><button>+ Add new Pokémon</button></form>
                    </li>
                </ul>
            </section>
        </div>
        <aside>
            <form>
                <fieldset class="box-gray">
                    <legend>Jokers</legend>
                    <ul>
                        <li>
                            <button>
                                <img src="icons/jokers/joker-reroll.png" alt="reroll-icon" width="80" height="80">
                                <p>reroll</p>
                            </button>
                        </li>
                        <li>
                            <button>
                                <img src="icons/jokers/joker-sacrifice.png" alt="sacrifice-icon" width="80" height="80">
                                <p>sacrifice</p>
                            </button>
                        </li>
                        <li>
                            <button>
                                <img src="icons/jokers/joker-revive.png" alt="revive-icon" width="80" height="80">
                                <p>revive</p>
                            </button>
                        </li>
                    </ul>
                </fieldset>
            </form>
        </aside>
    </main>
    <footer>
    </footer>
</body>

</html>
