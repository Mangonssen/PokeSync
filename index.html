<!DOCTYPE html>
<html lang="en">

<head>
    <!-- =========================
         Core
    ========================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PokéSync SoulLink Manager</title>

    <meta name="description"
        content="Manage your Pokémon SoulLink challenge with your partner. Track team status, progress, and rules in authentic Gen 5 style.">

    <meta name="keywords"
        content="Pokémon, Pokemon, Pokédex, Pokedex, Pokémon companion, Pokémon tracker, PokéSync, Soul, Soul Link, Link, Soul-Link, Nuzlock">

    <meta name="author" content="Tim Ruland, Marc Obst">

    <!-- Tell search engines how to index the page -->
    <meta name="robots" content="index, follow, max-image-preview:large">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://example.com/">

    <!-- =========================
         PWA / Web App Manifest
    ========================== -->
    <link rel="manifest" href="/manifest.webmanifest">

    <meta name="theme-color" content="#050609">
    <meta name="color-scheme" content="dark">

    <!-- iOS / Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="PokéSync">

    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <!-- =========================
         Favicons
    ========================== -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">

    <!-- =========================
         Open Graph / Social SEO
    ========================== -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PokéSync">
    <meta property="og:title" content="PokéSync SoulLink Manager">
    <meta property="og:description"
        content="Manage your Pokémon SoulLink challenge with your partner. Track team status, progress, and rules in authentic Gen 5 style.">
    <meta property="og:url" content="https://example.com/">
    <meta property="og:image" content="https://example.com/images/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="PokéSync SoulLink Manager">

    <!-- =========================
         Twitter / X Cards
    ========================== -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PokéSync SoulLink Manager">
    <meta name="twitter:description"
        content="Manage your Pokémon SoulLink challenge with your partner. Track team status, progress, and rules in authentic Gen 5 style.">
    <meta name="twitter:image" content="https://example.com/images/og-image.png">
    <meta name="twitter:image:alt" content="PokéSync SoulLink Manager">

    <!-- =========================
         Performance
    ========================== -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> -->

         Structured Data / JSON-LD
    ========================== -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PokéSync",
        "alternateName": "PokeSync",
        "url": "https://example.com/",
        "description": "Manage your Pokémon SoulLink challenge with your partner. Track team status, progress, and rules in authentic Gen 5 style.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "author": [
            {
                "@type": "Person",
                "name": "Tim Ruland"
            },
            {
                "@type": "Person",
                "name": "Marc Obst"
            }
        ],
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.mjs"></script>
</head>
