<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeSsync</title>
    <script type="module" src="index.mjs"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <hgroup>
            <picture id="logo"><img src="" alt=""></picture>
            <h1 class="sr-only">PokeSync</h1>
            <p>v1.0 by Mangonssen & LPTimey</p>
        </hgroup>
    </header>
    <main>
        <aside>
            <form>
                <fieldset class="box-gray">
                    <legend>Controls</legend>
                    <ul>
                        <li><button type="button" aria-label="save"><img src="" alt="save-icon"></button></li>
                        <li><button type="button" aria-label="open"><img src="" alt="open-icon"></button></li>
                        <li><button type="button" aria-label="reset"><img src="" alt="reset-icon"></button></li>
                        <li><button type="button" aria-label="settings"><img src="" alt="settings-icon"></button></li>
                    </ul>
                </fieldset>
            </form>
        </aside>
        <div id="players">
            <section>
                <h2 contenteditable="">
                    Player 1
                </h2>
                <ul id="player1pokemon">
                    <li class="box" style="--color: red">
                        ABCDEFGHIKLMNOPQRSTUVWXYZ
                    </li>
                    <li class="box">
                        <form><button type="button">+</button></form>
                    </li>
                </ul>
            </section>
            <section>
                <h2 contenteditable="">
                    Player 2
                </h2>
                <ul id="player2pokemon">
                    <li class="box" style="--color: red">
                        HAHAHAHAHAHAHAH
                    </li>
                    <li class="box">
                        <form><button type="button">+</button></form>
                    </li>
                </ul>
            </section>
        </div>
        <aside >
            <form>
                <fieldset class="box-gray">
                    <legend>Jokers</legend>
                    <ul>
                        <li><button type="button"><img src="" alt="reroll-icon">
                                <p>reroll</p>
                            </button></li>
                        <li><button type="button"><img src="" alt="sacrifice-icon">
                                <p>sacrifice</p>
                            </button></li>
                        <li><button type="button"><img src="" alt="revive-icon">
                                <p>revive</p>
                            </button></li>
                    </ul>
                </fieldset>
            </form>
        </aside>
    </main>
    <footer></footer>
</body>

</html>
